; Massmore_ST7789 — PlatformIO multi-target project
; เปิดโฟลเดอร์นี้ใน VS Code แล้ว Build ได้ทันที ไม่ต้องติดตั้งอะไรเพิ่ม
;
; src/main.cpp = ตัวอย่าง 07_Factory_Test (เหมือนกับ ArduinoIDE/Massmore_ST7789/examples/07_Factory_Test)
; ต้องการลองตัวอย่างอื่น: copy เนื้อหา .ino จาก ArduinoIDE/Massmore_ST7789/examples/<ชื่อ>/
; มาทับ src/main.cpp แล้วเติม #include <Arduino.h> บรรทัดแรก
;
; ขาสัญญาณ / รุ่นจอ: default อยู่ใน lib/Massmore_ST7789/src/Massmore_ST7789_Config.h
; override ได้ต่อ environment ด้วย build_flags (ตัวอย่างด้านล่าง) โดยไม่ต้องแก้ไลบรารี

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
; ไลบรารี (รวม TFT_eSPI ที่ vendor ไว้) อยู่ใน lib/Massmore_ST7789 แล้ว — ไม่ใช้ lib_deps จาก registry

; ---------- ESP32 family: pin pioarduino เพื่อให้ได้ Arduino-ESP32 Core 3.x ----------
; 55.03.311 = Arduino-ESP32 Core 3.3.11 (ทดสอบผ่านแล้ว) — ดูรุ่นอื่นได้ที่
; https://github.com/pioarduino/platform-espressif32/releases
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
upload_speed = 921600          ; ค่าหลักสำหรับ Mac
; upload_speed = 512000        ; ทางเลือก ถ้าอัพโหลดไม่นิ่ง
; upload_speed = 460800        ; ทางเลือก ถ้ายังไม่นิ่ง
monitor_filters = esp32_exception_decoder

; ESP32 (Classic) — Primary Factory Test target
; default pins: MOSI 23, SCLK 18, MISO 19, CS 16, DC 2, RST 4 (BLK → 3V3)
[env:esp32dev]
extends = esp32_common
board = esp32dev
; build_flags = ${env.build_flags} -DTFT_CS=5 -DTFT_DC=2 -DTFT_RST=4 -DMASSMORE_ST7789_MISO=19   ; ตัวอย่าง override ขา
; build_flags = ${env.build_flags} -DMASSMORE_ST7789_PANEL=240            ; จอ 1.3" / 1.54" 240x240

; ESP32-S3 — default pins: MOSI 11, SCLK 12, MISO 13, CS 17, DC 3, RST 18 (BLK → 3V3)
[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- AVR: Arduino Nano (ATmega328P) ----------
; ไม่รองรับ: 2 KB SRAM / 32 KB Flash ไม่พอสำหรับจอสี 240x320 + Thai smooth font และ TFT_eSPI
; ไม่รองรับ AVR อย่างเป็นทางการ — ไลบรารีจะ #error ทันทีถ้า compile ด้วย AVR core (ดู README §3)
