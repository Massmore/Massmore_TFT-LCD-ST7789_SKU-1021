; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board's default JSON is the 8MB/no-PSRAM variant; override for 16MB flash + 8MB Octal PSRAM.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI has no User_Setup.h in this project; all display config is passed
; as build flags instead, per pins/settings from Massmore SKU-1021-TFT-LCD-ST7789
; (Arduino_Library/TFT_eSPI/User_Setup_ST7789_ESP32S3.h).
build_flags =
    -DBOARD_HAS_PSRAM

    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=17
    -DTFT_DC=3
    -DTFT_RST=18
    -DTFT_BL=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<*> -<sd_test.cpp>

; CH340 is a plain UART bridge, not native USB, so leave USB CDC settings alone.
; If auto-detect fails, uncomment and set to your port (e.g. /dev/cu.wchusbserialXXXX or COM5):
;upload_port = /dev/cu.wchusbserialXXXX
;monitor_port = /dev/cu.wchusbserialXXXX

; Standalone SD card bring-up test: `pio run -e sd_test -t upload -t monitor`
; Isolated from main.cpp/TFT_eSPI/touch so SD wiring/init can be debugged on its own.
[env:sd_test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<sd_test.cpp>
lib_deps =
monitor_speed = 115200
